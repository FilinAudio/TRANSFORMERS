rect class="ln" x="560" y="246" width="100" height="16" rx="4" fill="none" stroke-dasharray="3 3"/><text class="mut" x="140" y="294" font-size="13">Полоса по уровню −1 / −3 дБ</text><rect class="ln" x="560" y="280" width="100" height="16" rx="4" fill="none" stroke-dasharray="3 3"/><text class="mut" x="140" y="328" font-size="13">Индуктивность рассеяния</text><rect class="ln" x="560" y="314" width="100" height="16" rx="4" fill="none" stroke-dasharray="3 3"/><text class="mut" x="140" y="362" font-size="13">Разброс в паре</text><rect class="ln" x="560" y="348" width="100" height="16" rx="4" fill="none" stroke-dasharray="3 3"/><g transform="translate(140 420)"><rect width="520" height="110" fill="none" class="ln" stroke-width="1"/><path class="cu" d="M0 100C40 40 60 26 120 24S420 22 440 24c30 2 50 30 80 70" fill="none" stroke-width="2.5"/><path class="ln" d="M0 24H520M0 42H520" stroke-dasharray="4 4"/><text class="mut" x="4" y="20" font-size="11">0 дБ</text><text class="mut" x="4" y="56" font-size="11">−3 дБ</text></g></g><g transform="translate(400 560)"><rect x="-230" y="-20" width="460" height="40" rx="20" fill="#FFF0A8" stroke="#C8A400" stroke-dasharray="6 5"/><text x="0" y="6" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="18" fill="#4A3A00">[образец паспорта — уточнить у владельца]</text></g></svg>
